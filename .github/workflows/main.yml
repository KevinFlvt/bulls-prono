name: Bulls tracker 2 

on:
  schedule:
    - cron: "*/30 * * * *"   # toutes les 30 min (heure UTC, des retards de quelques minutes sont normaux)
  workflow_dispatch:          # permet de le lancer à la main depuis l'onglet Actions

permissions:
  contents: write             # nécessaire pour enregistrer data/bets.csv dans le dépôt

concurrency:
  group: bulls-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Capturer les cotes et régler les paris
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 bulls_tracker.py

      - name: Enregistrer les données
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bets.csv
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Mise à jour des paris Bulls"
            git pull --rebase
            git push
          fi
